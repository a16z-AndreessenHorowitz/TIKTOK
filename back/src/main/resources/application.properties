spring.application.name=back

spring.datasource.url=jdbc:mysql://localhost:3306/tiktac
spring.datasource.username=root
spring.datasource.password=a16z

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.root=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type=ERROR

# JWT: đổi jwt-secret production (tối thiểu 32 ký tự UTF-8). Refresh lưu cookie httpOnly.
app.auth.jwt-secret=${JWT_SECRET:dev-only-change-me-please-use-32chars-min!!}
app.auth.access-ttl-minutes=15
app.auth.refresh-ttl-days=30
app.auth.refresh-cookie-name=tt_refresh_token
app.auth.cookie-secure=false

# Video local: mặc định lưu trong back/uploads/videos; có thể override bằng VIDEO_STORAGE_DIR.
app.video.storage-dir=${VIDEO_STORAGE_DIR:uploads/videos}
app.video.url-prefix=/api/v1/videos/files
app.video.recommendation-score-refresh-ms=300000
app.video.recommendation-score-batch-size=1000
app.video.recommendation-score-max-batches=5
app.avatar.storage-dir=${AVATAR_STORAGE_DIR:uploads/avatars}
app.avatar.url-prefix=/api/v1/users/avatars

# Cho phép upload video lớn hơn default 1MB của multipart.
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
